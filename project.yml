name: Nomindo
options:
  bundleIdPrefix: com.nomindo
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""

targets:
  Nomindo:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Nomindo/Sources
      - path: Nomindo/Resources
        excludes:
          - "**/*.md"
    info:
      path: Nomindo/Resources/Info.plist
      properties:
        CFBundleDisplayName: Nomindo
        CFBundleName: Nomindo
        CFBundleIdentifier: com.nomindo.app
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Nomindo spor yaptiginizi yapay zeka ile dogrulamadan alarmi kapatmaniza izin vermez."
        UIBackgroundModes:
          - audio
          - fetch
    settings:
      base:
        INFOPLIST_FILE: Nomindo/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.nomindo.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
